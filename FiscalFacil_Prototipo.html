<dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">¿Borrar tu progreso?</h2><p>Se borrarán las respuestas iniciales, las lecciones completadas y las marcas de esta guía. Puedes comenzar de nuevo cuando quieras.</p><div class="actions"><button class="btn secondary" id="reset-cancel" autofocus>Conservar mi progreso</button><button class="btn" id="reset-confirm">Borrar progreso</button></div></dialog>
<noscript><p>Activa JavaScript para utilizar las herramientas de aprendizaje de FiscalFácil.</p></noscript>
<script>
(()=>{
const currency = cents => new Intl.NumberFormat('es-MX', {style:'currency',currency:'MXN'}).format(cents / 100);

function parseAmount(value, label='El importe') {
  const text=String(value).trim();
  if(!/^\d{1,7}(?:[.,]\d{1,2})?$/.test(text)) throw new Error(`${label}: escribe un número positivo con hasta dos decimales, sin separadores de miles.`);
  const [whole,fraction='']=text.replace(',','.').split('.');
  return Number(whole)*100+Number(fraction.padEnd(2,'0'));
}
function purchase(input) {
  const price=parseAmount(input.price,'Precio');
  const shipping=parseAmount(input.shipping,'Envío');
  const fee=parseAmount(input.fee,'Comisión');
  const discount=parseAmount(input.discount,'Descuento');
  if(price===0) throw new Error('El precio debe ser mayor que cero.');
  if(discount>price) throw new Error('El descuento no puede ser mayor que el precio.');
  if(!['included','added','none'].includes(input.mode)) throw new Error('Selecciona cómo se presenta el impuesto.');
  const rate=input.mode==='none'?'0':String(input.rate).trim();
  if(!/^\d{1,2}(?:[.,]\d{1,2})?$/.test(rate)) throw new Error('La tasa de práctica debe estar entre 0 y 99.99 %.');
  const rateBp=Math.round(Number(rate.replace(',','.'))*100);
  const discounted=price-discount;
  const tax=input.mode==='none'?0:Math.round(input.mode==='included'?discounted*rateBp/(10000+rateBp):discounted*rateBp/10000);
  const base=input.mode==='included'?discounted-tax:discounted;
  const total=base+tax+shipping+fee;
  return {price,discount,base,tax,shipping,fee,total,rate:Number(rate.replace(',','.')),mode:input.mode};
}
const orientationQuestions=[
 {key:'situation',title:'¿En qué momento estás?',hint:'Elige lo más cercano a ti. No necesitas compartir tu edad ni datos personales.',options:['Estoy estudiando y quiero prepararme','Estoy por empezar mi primer empleo','Ya tengo mi primer empleo']},
 {key:'experience',title:'¿Qué tan familiar te resulta?',hint:'No hay una respuesta correcta. Esto nos ayuda a sugerirte por dónde comenzar.',options:['Estoy empezando desde cero','Conozco algunas palabras','Ya registro ingresos y gastos']},
 {key:'goal',title:'¿Qué quieres entender primero?',hint:'Podrás recorrer todas las herramientas después.',options:['Mi primer recibo de sueldo','El precio final de una compra','Cómo preparar una declaración']}
];
function getRoute(profile){
 if(profile.goal===orientationQuestions[2].options[1]) return {route:'compras',title:'Entiende el precio completo',text:'Prueba una compra y descubre qué cambia cuando el impuesto ya está incluido o se añade al final.'};
 if(profile.goal===orientationQuestions[2].options[2]) return {route:'guia',title:'Primero prepara la información',text:'Recorre los pasos de una declaración. Podrás distinguir la preparación del envío en el portal oficial.'};
 return {route:'empleo',title:'Empieza por tu recibo de sueldo',text:'Aprende a distinguir lo que ganas, las retenciones y lo que finalmente recibes con un caso ficticio.'};
}
const sources=[
 {title:'Quiénes presentan la declaración anual',url:'https://www.sat.gob.mx/minisitio/DeclaracionAnual/Personas/quienes_deben_presentarla.html',note:'SAT · ejercicio 2025. Revisa el ejercicio y los supuestos aplicables.'},
 {title:'Requisitos para la declaración anual',url:'https://www.sat.gob.mx/minisitio/DeclaracionAnual/Personas/requisitos.html',note:'SAT · ejercicio 2025. Los requisitos dependen del caso.'},
 {title:'Portal del SAT',url:'https://www.sat.gob.mx/',note:'Consulta trámites, orientación y datos de contacto oficiales.'}
];
const lessons=[
 {title:'Lee tu recibo',intro:'Tu sueldo anunciado y el depósito que recibes pueden ser distintos. El recibo permite revisar cómo se obtiene esa diferencia.',terms:[['Ingreso bruto','Lo que ganas antes de las retenciones y otros descuentos.'],['Retención','Una cantidad que quien te paga descuenta y, cuando corresponde, entrega a la autoridad.'],['Ingreso neto','Lo que recibes después de los descuentos del recibo.']],question:'En este ejemplo, ¿cuánto dinero se deposita?',options:['$8,000.00','$7,500.00','$500.00'],answer:1,explanation:'$8,000.00 − $400.00 − $100.00 = $7,500.00. Los descuentos fueron dados para este ejercicio; no se calcularon con una tarifa fiscal.'},
 {title:'Organiza tus comprobantes',intro:'Un comprobante te ayuda a recordar y revisar una operación. Guardarlo no significa que cualquier gasto sea deducible.',terms:[['Comprobante','Documento que describe una operación. Puede incluir fecha, emisor, conceptos e importes.'],['CFDI','Comprobante fiscal digital por Internet. Su representación visual y sus datos deben revisarse en el contexto correspondiente.'],['Deducción','Concepto que puede intervenir en un cálculo fiscal si cumple las condiciones aplicables. No equivale a todos tus gastos.']],question:'Si tienes un comprobante de una compra, ¿qué puedes concluir?',options:['Todo gasto con comprobante se puede deducir','Ya no necesito revisar ningún dato','Puedo revisar la operación, pero su deducibilidad depende de las reglas'],answer:2,explanation:'Conservar un comprobante facilita la organización. La deducibilidad requiere revisar las condiciones del gasto y de tu situación.'},
 {title:'Distingue tu siguiente paso',intro:'El primer empleo no significa que todas las personas tengan que presentar exactamente la misma declaración.',terms:[['RFC','Registro Federal de Contribuyentes. No necesitas escribirlo en esta herramienta de aprendizaje.'],['Declaración','Información que se presenta ante la autoridad conforme a las obligaciones aplicables.'],['Acuse','Constancia de recepción de un trámite. Completar una práctica aquí no genera un acuse del SAT.']],question:'¿Qué haces antes de decidir si debes presentar una declaración?',options:['Reviso mi situación y los supuestos en fuentes oficiales','Supongo que todos los jóvenes declaran lo mismo','Uso el resultado de una simulación como comprobante oficial'],answer:0,explanation:'Revisa el ejercicio y tu caso en fuentes oficiales. Esta guía te prepara para entenderlos, pero no determina tus obligaciones.'}
];
const declarationSteps=[
 ['Identifica tu situación','Revisa tu tipo de ingresos y el ejercicio. Consulta quiénes deben presentar la declaración y sus excepciones. No decidas solo por tu edad.'],
 ['Reúne la información','Organiza recibos, comprobantes y datos del periodo. Compara importes y fechas; marca las diferencias para revisarlas.'],
 ['Revisa el canal oficial','Entra por el portal del SAT y consulta los requisitos del trámite. FiscalFácil no te solicitará contraseña del SAT ni archivos de e.firma.'],
 ['Comprueba antes de enviar','Verifica la información, el periodo y el resultado. Si algo no cuadra, busca orientación antes de continuar.'],
 ['Conserva el acuse','Después de realizar el trámite oficial, conserva el acuse y, cuando corresponda, la información de pago. Una marca en esta guía solo registra aprendizaje.']
];
function loadLearning(storage){
 try {const data=JSON.parse(storage.getItem('ff-learning-v1'));if(data?.version!==1)return {version:1,profile:null,passed:[],checked:[]};
 const profile=data.profile&&orientationQuestions.every(q=>q.options.includes(data.profile[q.key]))?data.profile:null;
 return {version:1,profile,passed:[...new Set((Array.isArray(data.passed)?data.passed:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<lessons.length))],checked:[...new Set((Array.isArray(data.checked)?data.checked:[]).filter(n=>Number.isInteger(n)&&n>=0&&n<declarationSteps.length))]};
 }catch{return {version:1,profile:null,passed:[],checked:[]};}
}

const $=s=>document.querySelector(s);
const escape=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let storage;try{storage=window.localStorage;}catch{}
let state=loadLearning(storage),orientationStep=0,draft={...(state.profile||{})},lesson=0,quizMessage='',quizGood=false;
let calc={price:'1160',mode:'included',rate:'16',discount:'0',shipping:'0',fee:'0'};
let calcResult=purchase(calc),calcError='',calcDirty=false,toastTimer;
const menu=[['inicio','⌂','Mi punto de partida'],['empleo','01','Mi primer empleo'],['compras','02','Simular una compra'],['guia','03','Preparar una declaración'],['fuentes','↗','Fuentes y conceptos']];
const routes=new Set([...menu.map(m=>m[0]),'orientacion','datos']);
let route=routes.has(location.hash.slice(1))?location.hash.slice(1):'inicio';
const button=(label,action,kind='')=>`<button class="btn ${kind}" data-action="${action}">${label}</button>`;
const link=(label,path,kind='')=>`<a class="btn ${kind}" href="#${path}">${label}</a>`;
const heading=(eyebrow,title,description)=>`<div class="page-intro"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${description}</p></div>`;
function notify(message){$('#notice').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#notice').textContent='',6500);}
function save(){try{storage.setItem('ff-learning-v1',JSON.stringify(state));}catch{notify('No se pudo guardar el progreso. Puedes seguir aprendiendo durante esta sesión.');}}
function go(next){if(route===next){render();$('#main').focus();}else location.hash=next;}
function home(){
 const plan=state.profile?getRoute(state.profile):null;
 return heading('APRENDE A TU RITMO','Tu primer paso, con claridad.','Entiende tu sueldo, descubre qué hay detrás de una compra y prepárate para los temas fiscales.')+
 `<div class="grid"><section class="card feature"><div class="eyebrow">APRENDER Y PRACTICAR</div><h2>${plan?escape(plan.title):'Empieza por lo que necesitas entender.'}</h2><p>${plan?escape(plan.text):'Tres preguntas sencillas para encontrar tu punto de partida. Sin cuenta y sin datos fiscales.'}</p><span class="meta">${state.passed.length} de 3 lecciones completadas</span>${link(plan?'Continuar mi ruta →':'Encontrar mi punto de partida →',plan?plan.route:'orientacion','white')}</section>
 <section class="card"><span class="status-label">PRÓXIMA ETAPA</span><h2>Organizar mis datos reales</h2><p>El espacio con cuentas y documentos personales se construirá en la siguiente etapa.</p><p>Mientras tanto, puedes explorar el cuaderno anterior con movimientos ficticios e importación de archivos de ejemplo.</p><div class="actions">${link('Ver qué incluye','datos','secondary')}</div></section></div>
 <div class="section-head"><h2>También puedes comenzar aquí</h2><span class="meta">Herramientas sin registro</span></div><div class="path-grid">
 ${[['01','Tu primer recibo','Distingue lo que ganas de lo que recibes. Practica con un recibo ficticio.','empleo','Abrir lecciones'],['02','El precio completo','Prueba descuentos, impuestos y cargos antes de una compra simulada.','compras','Abrir simulador'],['03','Antes de declarar','Conoce qué revisar, qué reunir y cuándo acudir al canal oficial.','guia','Abrir guía']].map(([n,t,d,r,label])=>`<article class="path-card"><span class="number">${n}</span><h3>${t}</h3><p>${d}</p><a href="#${r}">${label} →</a></article>`).join('')}</div>
 <div class="storage">Guardamos únicamente tus preferencias y avance educativo en este navegador. No te pedimos RFC ni contraseña del SAT. ${state.profile?'<button class="link" data-action="edit-profile">Cambiar mis respuestas</button>':''} <button class="link" data-action="reset">Borrar mi progreso</button></div>`;
}
function orientation(){
 const q=orientationQuestions[orientationStep];
 return heading('TU PUNTO DE PARTIDA','Hagamos una ruta para ti.','Estas respuestas adaptan el aprendizaje. No determinan tu régimen ni tus obligaciones.')+
 `<section class="card narrow"><div class="progress-line"><span>Paso ${orientationStep+1} de 3</span><span>Sin datos personales</span></div><progress aria-label="Progreso de preguntas" max="3" value="${orientationStep+1}"></progress><h2 id="question-heading">${q.title}</h2><p>${q.hint}</p>
 <form id="orientation-form"><fieldset class="choices"><legend class="sr-only">${q.title}</legend>${q.options.map((opt,i)=>`<label class="choice"><input type="radio" name="choice" value="${i}" required ${draft[q.key]===opt?'checked':''}><span>${opt}</span></label>`).join('')}</fieldset><div class="actions">${orientationStep?button('Anterior','previous-question','secondary'):link('Volver','inicio','secondary')}<button class="btn">${orientationStep===2?'Guardar mi ruta':'Continuar'}</button></div></form></section>`;
}
function employment(){
 const current=lessons[lesson];
 return heading('MI PRIMER EMPLEO','Entiende lo que recibes.','Tres lecciones breves con ejemplos y preguntas para comprobar lo que aprendiste.')+
 `<div class="steps-nav" aria-label="Lecciones">${lessons.map((l,i)=>`<button data-action="lesson:${i}" ${i===lesson?'aria-current="step"':''}>${state.passed.includes(i)?'✓':i+1} · ${['Tu recibo','Comprobantes','Siguiente paso'][i]}</button>`).join('')}</div><div class="grid"><section class="card"><div class="progress-line"><span>Lección ${lesson+1} de 3</span><span>${state.passed.length} completadas</span></div><progress max="3" value="${state.passed.length}" aria-label="Lecciones completadas"></progress><h2>${current.title}</h2><p>${current.intro}</p>${current.terms.map(([t,d])=>`<div class="definition"><h3>${t}</h3><p>${d}</p></div>`).join('')}
 <form id="quiz-form" class="quiz"><h3>${current.question}</h3><fieldset class="choices"><legend class="sr-only">${current.question}</legend>${current.options.map((opt,i)=>`<label class="choice"><input type="radio" name="answer" value="${i}" required><span>${opt}</span></label>`).join('')}</fieldset><button class="btn">Comprobar mi respuesta</button><div class="feedback ${quizGood?'':'error'}" id="quiz-feedback" role="status">${escape(quizMessage)}</div><div id="quiz-next">${quizGood?nextLesson():''}</div></form></section>
 <aside>${lesson===0?`<section class="receipt"><div class="receipt-title">RECIBO DE PRÁCTICA</div><span class="receipt-label">Datos completamente ficticios</span><h2>Un periodo de trabajo</h2><dl><div><dt>Ingreso bruto</dt><dd>$8,000.00</dd></div><div><dt>Retención dada</dt><dd>− $400.00</dd></div><div><dt>Otro descuento dado</dt><dd>− $100.00</dd></div><div class="total"><dt>Depósito neto</dt><dd>¿Cuánto recibes?</dd></div></dl><p class="receipt-note">Las cantidades son datos del ejercicio. No son una estimación de ISR, cuotas ni una tarifa aplicable a tu sueldo.</p></section>`:`<section class="card"><div class="eyebrow">PARA RECORDAR</div><h2>${lesson===1?'Guarda y revisa.':'Tu situación importa.'}</h2><p>${lesson===1?'Fecha, concepto e importe te ayudan a reconstruir una operación. Si algo no coincide, primero revisa el documento original.':'No todas las personas presentan las mismas declaraciones. Antes de actuar, revisa el ejercicio y los supuestos en la fuente oficial.'}</p><a href="#fuentes">Consultar fuentes y conceptos →</a></section>`}<p class="note">Contenido educativo revisado el 23 de septiembre de 2026. Las fuentes fiscales de esta versión corresponden al ejercicio 2025.</p></aside></div>`;
}
function nextLesson(){return `<div class="actions">${lesson<2?button('Siguiente lección →','lesson:'+(lesson+1)):link('Ir a la guía de declaración →','guia')}</div>`;}
function receipt(){
 if(calcError)return `<section class="receipt"><div class="receipt-title">REVISA LOS DATOS</div><h2>Falta corregir un importe</h2><p class="feedback error" role="alert">${escape(calcError)}</p><p>Corrige los campos y vuelve a calcular. No mostramos el total anterior para evitar confusiones.</p></section>`;
 const r=calcResult;
 return `<section class="receipt"><div class="receipt-title">TU COMPRA SIMULADA</div><span class="receipt-label">${r.mode==='included'?'Impuesto ya incluido':r.mode==='added'?'Impuesto añadido':'Sin impuesto en este ejercicio'}</span><dl><div><dt>Precio anunciado</dt><dd>${currency(r.price)}</dd></div>${r.discount?`<div><dt>Descuento</dt><dd>− ${currency(r.discount)}</dd></div>`:''}<div><dt>Base después del descuento</dt><dd>${currency(r.base)}</dd></div><div><dt>Impuesto de práctica${r.mode==='none'?'':` (${r.rate} %)`}</dt><dd>${currency(r.tax)}</dd></div><div><dt>Envío final</dt><dd>${currency(r.shipping)}</dd></div><div><dt>Comisión final</dt><dd>${currency(r.fee)}</dd></div><div class="total"><dt>Total</dt><dd data-total>${currency(r.total)}</dd></div></dl>
 <p class="receipt-note">${r.mode==='included'?'El impuesto se separa del precio después del descuento. No se suma otra vez.':r.mode==='added'?'El impuesto se calcula sobre el precio después del descuento y se añade una sola vez.':'Se omite el impuesto únicamente para este caso de práctica; esto no determina si una compra real está exenta.'}</p><div class="calculation-status" role="status">${calcDirty?'Hay cambios sin calcular. Pulsa Calcular desglose.':'Desglose calculado con los datos visibles.'}</div></section>`;
}
function purchases(){return heading('SIMULADOR DE COMPRAS','Que el total no te sorprenda.','Cambia los importes y revisa de dónde sale cada peso. Aquí no se realizan compras ni pagos.')+
 `<div class="calculator"><div class="grid"><section class="card"><h2>Arma tu ejemplo</h2><div class="example-buttons" aria-label="Ejemplos rápidos"><button data-action="example:included">Impuesto incluido</button><button data-action="example:added">Impuesto añadido</button><button data-action="example:discount">Con descuento y envío</button></div><form id="purchase-form"><div class="field-grid">
 ${[['price','Precio anunciado','1160'],['discount','Descuento sobre ese precio','0']].map(([key,label,placeholder])=>amountField(key,label,placeholder)).join('')}
 <label class="field wide">¿Cómo se presenta el impuesto?<select name="mode" id="tax-mode"><option value="included" ${calc.mode==='included'?'selected':''}>Ya está incluido en el precio</option><option value="added" ${calc.mode==='added'?'selected':''}>Se añade al precio</option><option value="none" ${calc.mode==='none'?'selected':''}>Sin impuesto en este ejercicio</option></select></label>
 <label class="field wide">Tasa de práctica (%)<input name="rate" id="rate" inputmode="decimal" value="${escape(calc.rate)}" required maxlength="5" ${calc.mode==='none'?'disabled':''}><small>El 16 % es un supuesto editable del ejemplo, no una tasa universal para cualquier producto.</small></label>
 ${amountField('shipping','Envío final','0')}${amountField('fee','Comisión final','0')}</div><div class="actions"><button class="btn">Calcular desglose</button>${button('Restablecer ejemplo','example:included','secondary')}</div><p class="note">Importes en MXN. El descuento se aplica antes de separar o añadir el impuesto. Envío y comisión son cargos finales; no les añadimos otro impuesto. Los resultados se redondean a centavos.</p></form></section><aside class="calc-result" id="purchase-result" aria-live="polite">${receipt()}</aside></div></div>`;
}
function amountField(key,label,placeholder){return `<label class="field">${label}<input name="${key}" inputmode="decimal" value="${escape(calc[key])}" placeholder="${placeholder}" required maxlength="10" aria-label="${label}"></label>`;}
function guide(){return heading('PREPARAR UNA DECLARACIÓN','Primero comprende el proceso.','Usa esta lista para aprender qué revisar. Marcar un paso no presenta una declaración ni acredita cumplimiento fiscal.')+
 `<div class="grid"><section class="card"><div class="progress-line"><span>Mi recorrido de aprendizaje</span><span id="guide-count">${state.checked.length} de 5 pasos revisados</span></div><progress id="guide-progress" max="5" value="${state.checked.length}" aria-label="Pasos de la guía revisados"></progress>${declarationSteps.map(([t,d],i)=>`<div class="check-row"><label><input type="checkbox" data-guide="${i}" ${state.checked.includes(i)?'checked':''}><div><h2>${i+1}. ${t}</h2><p>${d}</p></div></label></div>`).join('')}<div id="guide-complete" role="status">${guideComplete()}</div></section><aside><section class="card"><div class="eyebrow">ANTES DE CONTINUAR</div><h2>¿Me corresponde declarar?</h2><p>Depende de tu situación y del ejercicio. Esta herramienta no decide tus obligaciones ni estima tu impuesto anual.</p><a href="${sources[0].url}" target="_blank" rel="noopener noreferrer">Revisar supuestos en el SAT ↗</a><p class="note">Referencia: declaración anual del ejercicio 2025. Comprueba que corresponda al periodo que buscas.</p></section><p class="note">Para un trámite real, utiliza el canal oficial. Nunca introduzcas contraseñas del SAT o e.firma en este prototipo.</p></aside></div>`;}
function guideComplete(){return state.checked.length===5?'<p class="feedback">Terminaste el recorrido de preparación. Esto registra tu aprendizaje; el trámite real se realiza en el canal oficial.</p>':'';}
function sourcePage(){return heading('PALABRAS Y FUENTES','Información que puedes comprobar.','Consulta las definiciones y abre directamente las referencias oficiales.')+`<div class="grid"><section class="card"><h2>Conceptos esenciales</h2>${[['Ingreso','Dinero que recibes. Su tratamiento fiscal depende de su origen y de tu situación.'],['Gasto','Dinero que utilizas en una compra o servicio. No todos los gastos son deducibles.'],['ISR','Impuesto sobre la renta. Este prototipo no calcula una obligación real de ISR.'],['IVA','Impuesto al valor agregado. La tasa y el tratamiento dependen del acto o actividad; el simulador utiliza supuestos editables.'],['Simulación','Ejercicio para aprender. No genera una declaración, pago ni validación oficial.']].map(([t,d])=>`<div class="definition"><h3>${t}</h3><p>${d}</p></div>`).join('')}</section><section class="card"><h2>Canales oficiales</h2><ul class="sources">${sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.title} ↗</a><p>${s.note}</p></li>`).join('')}</ul><p class="note">Última revisión del contenido: 23 de septiembre de 2026. Las reglas pueden cambiar. Consulta la información del ejercicio correspondiente antes de realizar un trámite.</p></section></div>`;}
function personal(){return heading('ORGANIZAR MIS DATOS','Un espacio personal, en la siguiente etapa.','Las cuentas reales y el almacenamiento de comprobantes todavía no están habilitados.')+
 `<div class="grid"><section class="card"><span class="status-label">EN PREPARACIÓN</span><h2>Lo que podrás hacer</h2><div class="definition"><h3>Registrar ingresos y gastos</h3><p>Guardar movimientos con una cuenta, corregirlos y consultar un resumen mensual.</p></div><div class="definition"><h3>Importar y revisar archivos</h3><p>Reconocer datos de archivos y comprobantes, revisar lo dudoso y confirmar antes de guardar.</p></div><div class="definition"><h3>Exportar tu información</h3><p>Obtener movimientos en Excel y un resumen mensual en PDF.</p></div><div class="actions">${link('Seguir aprendiendo','inicio','secondary')}</div></section><section class="card"><div class="eyebrow">YA PUEDES EXPLORAR</div><h2>Cuaderno de práctica anterior</h2><p>Conservamos los movimientos ficticios, la importación de ejemplos y los recorridos de la versión anterior.</p><p>Su acceso es una demostración, no una cuenta segura. Utiliza únicamente archivos ficticios.</p><a class="btn secondary" href="https://sarrglx.github.io/fiscalfacil/">Abrir cuaderno de práctica →</a><p class="note">Usuario de práctica: santiago.demo<br>Clave ficticia: demo1234</p></section></div>`;}
function render(){
 document.title=`${({inicio:'Aprende',orientacion:'Tu ruta',empleo:'Primer empleo',compras:'Simular compras',guia:'Preparar una declaración',fuentes:'Fuentes',datos:'Datos personales'}[route])} · FiscalFácil`;
 $('#app').innerHTML=`<aside class="rail"><a class="brand" href="#inicio"><span class="mark">f.</span>FiscalFácil</a><p class="rail-label">MI APRENDIZAJE</p><nav aria-label="Navegación principal">${menu.map(([id,icon,title])=>`<a href="#${id}" ${route===id||route==='orientacion'&&id==='inicio'?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${title}</a>`).join('')}</nav><div class="rail-bottom"><p>Entender primero.<br>Decidir con información.</p><a href="#datos">Mi espacio personal →</a><a href="https://sarrglx.github.io/fiscalfacil/">Cuaderno de práctica anterior</a></div></aside><div class="shell"><header class="topbar"><div class="topbar-left"><span class="mode">Aprender y practicar</span><span class="meta">Sin cuenta</span></div><a class="link" href="#datos">Organizar mis datos</a></header><main id="main" tabindex="-1">${({inicio:home,orientacion:orientation,empleo:employment,compras:purchases,guia:guide,fuentes:sourcePage,datos:personal}[route])()}</main><footer class="bottom"><span>FiscalFácil · Primera entrega funcional</span><span>Aprendizaje gratuito · Sin anuncios</span></footer></div>`;
 bind();
}
function bind(){
 document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
  const [action,id]=el.dataset.action.split(':');
  if(action==='previous-question'){orientationStep--;render();$('#main').focus();}
  if(action==='edit-profile'){draft={...state.profile};orientationStep=0;go('orientacion');}
  if(action==='lesson'){lesson=Number(id);quizMessage='';quizGood=false;render();$('#main').focus();window.scrollTo(0,0);}
  if(action==='example'){calc=id==='added'?{price:'1000',mode:'added',rate:'16',discount:'0',shipping:'0',fee:'0'}:id==='discount'?{price:'1160',mode:'included',rate:'16',discount:'116',shipping:'80',fee:'20'}:{price:'1160',mode:'included',rate:'16',discount:'0',shipping:'0',fee:'0'};calcResult=purchase(calc);calcError='';calcDirty=false;render();$('#purchase-form input').focus();}
  if(action==='reset')$('#reset-dialog').showModal();
 }));
 $('#orientation-form')?.addEventListener('change',event=>{if(event.target.name==='choice')draft[orientationQuestions[orientationStep].key]=orientationQuestions[orientationStep].options[Number(event.target.value)];});
 $('#orientation-form')?.addEventListener('submit',event=>{event.preventDefault();const selected=new FormData(event.target).get('choice');if(selected===null)return;draft[orientationQuestions[orientationStep].key]=orientationQuestions[orientationStep].options[Number(selected)];if(orientationStep<2){orientationStep++;render();$('#main').focus();}else{state.profile={...draft};save();orientationStep=0;go('inicio');notify('Tu ruta está lista. Puedes cambiarla cuando quieras.');}});
 $('#quiz-form')?.addEventListener('submit',event=>{event.preventDefault();const value=new FormData(event.target).get('answer');if(value===null)return;quizGood=Number(value)===lessons[lesson].answer;quizMessage=quizGood?'Correcto. '+lessons[lesson].explanation:'Vamos a revisarlo. '+lessons[lesson].explanation;if(quizGood&&!state.passed.includes(lesson)){state.passed.push(lesson);save();}const selected=Number(value);render();const chosen=$(`[name="answer"][value="${selected}"]`);if(chosen)chosen.checked=true;const feedback=$('#quiz-feedback');feedback.tabIndex=-1;feedback.focus();});
 $('#purchase-form')?.addEventListener('input',event=>{if(event.target.name){calc[event.target.name]=event.target.value;calcDirty=true;const label=$('.calculation-status');if(label)label.textContent='Hay cambios sin calcular. Pulsa Calcular desglose.';} });
 $('#tax-mode')?.addEventListener('change',()=>{calc.mode=$('#tax-mode').value;$('#rate').disabled=calc.mode==='none';calcDirty=true;const label=$('.calculation-status');if(label)label.textContent='Hay cambios sin calcular. Pulsa Calcular desglose.';});
 $('#purchase-form')?.addEventListener('submit',event=>{event.preventDefault();const values=new FormData(event.target);for(const key of Object.keys(calc))if(values.has(key))calc[key]=String(values.get(key));try{calcResult=purchase(calc);calcError='';calcDirty=false;}catch(error){calcError=error.message;}$('#purchase-result').innerHTML=receipt();});
 document.querySelectorAll('[data-guide]').forEach(box=>box.addEventListener('change',()=>{const id=Number(box.dataset.guide);state.checked=box.checked?[...new Set([...state.checked,id])]:state.checked.filter(x=>x!==id);save();$('#guide-count').textContent=`${state.checked.length} de 5 pasos revisados`;$('#guide-progress').value=state.checked.length;$('#guide-complete').innerHTML=guideComplete();}));
}
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){$('#main').focus();return;}route=routes.has(location.hash.slice(1))?location.hash.slice(1):'inicio';render();$('#main').focus();window.scrollTo(0,0);});
$('#reset-confirm').addEventListener('click',()=>{state={version:1,profile:null,passed:[],checked:[]};draft={};orientationStep=0;lesson=0;quizMessage='';quizGood=false;save();$('#reset-dialog').close();render();$('#main').focus();notify('Se borró el progreso de aprendizaje. El cuaderno anterior conserva sus datos por separado.');});
$('#reset-cancel').addEventListener('click',()=>$('#reset-dialog').close());
render();

})();
</script></body></html>
